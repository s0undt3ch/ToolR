name: Apply Release Patch
description: Prepare a release of ToolR

inputs:
  release-patch-name:
    required: true
    description: 'Release patch to apply'


runs:
  using: composite

  steps:

    - name: Download Release Patch Artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.release-patch-name }}

    - name: Apply The Release Patch
      id: apply
      shell: bash
      env:
        RELEASE_PATCH_NAME: ${{ inputs.release-patch-name }}
      run: |
        git am --committer-date-is-author-date "$RELEASE_PATCH_NAME"
        # The patch was built on the dispatched commit; a release tagged on any other base ships an untested tree.
        base="$(git rev-parse HEAD^)"
        if [[ "$base" != "$GITHUB_SHA" ]]; then
          echo "::error::The release patch was applied on ${base}, not on the dispatched commit ${GITHUB_SHA}" >&2
          exit 1
        fi
