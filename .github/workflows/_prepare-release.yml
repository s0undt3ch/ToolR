name: Prepare Release

on:
  workflow_call:
    inputs:
      release-version:
        required: false
        type: string
        description: 'Release version to prepare'
        default: ''
      github-app-client-id:
        required: false
        type: string
        description: 'GitHub App Client ID for authentication'
      environment:
        required: false
        type: string
        description: 'GitHub environment to use'
        default: ''
      cache-seed:
        required: true
        type: string
        description: 'Seed mixed into every cache key. Bump in the caller workflow to invalidate.'
      mise-version:
        required: true
        type: string
        description: 'Version of mise to install. Pass the caller workflow''s MISE_VERSION env var.'
    secrets:
      github-app-private-key:
        required: false
        description: 'GitHub App private key for authentication'
    outputs:
      release-version:
        description: 'Prepared release version'
        value: ${{ jobs.prepare-release.outputs.release-version }}
      release-patch-name:
        description: 'Name of the release patch'
        value: ${{ jobs.prepare-release.outputs.release-patch-name }}
      release-notes-filename:
        description: 'Name of the release notes file'
        value: ${{ jobs.prepare-release.outputs.release-notes-filename }}
      binary-release-tarball-name:
        description: 'Name of the binary-wheel (toolr) sdist tarball'
        value: ${{ jobs.prepare-release.outputs.binary-release-tarball-name }}
      py-release-tarball-name:
        description: 'Name of the toolr-py (pyo3) sdist tarball'
        value: ${{ jobs.prepare-release.outputs.py-release-tarball-name }}

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment != '' && inputs.environment || null }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      release-version: ${{ steps.bump-version.outputs.release-version }}
      release-patch-name: ${{ steps.bump-version.outputs.release-patch-name }}
      release-notes-filename: ${{ steps.prepare-release-notes.outputs.release-notes-filename }}
      binary-release-tarball-name: ${{ steps.create-source-tarball.outputs.binary-release-tarball-name }}
      py-release-tarball-name: ${{ steps.create-source-tarball.outputs.py-release-tarball-name }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Create GitHub App Token
        if: inputs.github-app-client-id != ''
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-private-key }}
          # Only resolves the bot user and checks out; commits and tags stay local.
          permission-contents: read

      - name: Get GitHub App User ID
        if: inputs.github-app-client-id != ''
        id: get-user-id
        shell: bash
        run: |
          echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: ${{ inputs.mise-version }}
          cache: true
          cache_key_prefix: ${{ inputs.cache-seed }}|mise|${{ inputs.mise-version }}|prepare-release|${{ runner.os }}|${{ runner.arch }}

      - name: Setup ToolR
        # In-repo composite action: downloads the toolr binary from a
        # GitHub release, verifies the SLSA build provenance, and
        # caches the in-tree `tools/.venv` for the prepare-release
        # job's `toolr` invocations.
        id: setup-toolr
        uses: ./
        with:
          version: latest
          cache-prefix: ${{ inputs.cache-seed }}|setup-toolr|prepare-release

      - name: Setup Prek
        id: setup-pre-commit
        uses: ./.github/actions/setup-pre-commit
        with:
          cache-seed: ${{ inputs.cache-seed }}|prepare-release
          mise-version: ${{ inputs.mise-version }}

      - name: Configure Git (with App)
        if: inputs.github-app-client-id != ''
        shell: bash
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Configure Git (default)
        if: inputs.github-app-client-id == ''
        uses: ./.github/actions/configure-git

      - name: Check skill references
        id: check-skill-refs
        # The regeneration after the bump would otherwise sweep any stale
        # reference already on main into the release commit.
        shell: bash
        run: |
          cargo xtask build-skill-refs --check

      - name: Bump Version
        id: bump-version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          new_version_arg=()
          if [ -n "$RELEASE_VERSION" ]; then
            new_version_arg=(--new-version="$RELEASE_VERSION")
          fi
          toolr version bump --write --check-existing-tag --include-action "${new_version_arg[@]}"

      - name: Regenerate skill references
        id: regen-skill-refs
        # The toolr-ci-setup reference is generated from `action.yml`, which the
        # bump just rewrote. The commit step rejects prek fixes outside the
        # release's own changes, so the reference has to be one of them.
        shell: bash
        run: |
          cargo xtask build-skill-refs

      - name: Load release notes into TOOLR_RELEASE_NOTES
        shell: bash
        # The cliff.toml body template reads TOOLR_RELEASE_NOTES via Tera
        # `get_env` and renders it under `### Notes`.
        run: toolr release-notes render --github-env "$GITHUB_ENV"

      - name: Generate changelog for GH release
        id: git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --unreleased --strip all
        env:
          # TOOLR_RELEASE_NOTES is inherited from the previous step's
          # $GITHUB_ENV write; cliff.toml reads it via Tera get_env.
          OUTPUT: .release-changes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Prepare GH Release changelog
        id: prepare-release-notes
        shell: bash
        run: |
          tail -n +3 .release-changes.md > release-notes.md
          echo "release-notes-filename=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Upload Release Notes Artifact
        id: upload-release-notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.prepare-release-notes.outputs.release-notes-filename }}
          path: ${{ steps.prepare-release-notes.outputs.release-notes-filename }}
          retention-days: 7
          if-no-files-found: error

      - name: Attest release notes artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        # Only run attestations on the main repository, not on forks
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
        with:
          subject-path: ${{ steps.prepare-release-notes.outputs.release-notes-filename }}

      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --verbose --unreleased --tag '${{ env.RELEASE_VERSION }}' --prepend CHANGELOG.md
        env:
          # TOOLR_RELEASE_NOTES is inherited from the loader step's
          # $GITHUB_ENV write; cliff.toml reads it via Tera get_env.
          GITHUB_REPO: ${{ github.repository }}

      - name: Clear queued release notes
        shell: bash
        run: toolr release-notes clear --rendered .release-changes.md

      - name: Commit changes
        id: commit-release
        shell: bash
        env:
          # `pin-github-actions` resolves pins through `gh api`.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        # Inputs come from env vars only, no `${{ }}` in the body: tests run it directly.
        run: |
          set -euo pipefail
          # NUL-separated so names with spaces or non-ASCII characters stay verbatim.
          # Plain `read -d ''` loops rather than mapfile, so the script also runs
          # under bash 3.2 in the tests.
          list_changed() {
            git diff --name-only -z HEAD > "$1"
            git ls-files --others --exclude-standard -z >> "$1"
          }
          # Print, NUL-separated, the paths in list file $2 that aren't in list file $1.
          newly_changed() {
            local path seen known
            while IFS= read -r -d '' path; do
              known=false
              while IFS= read -r -d '' seen; do
                if [ "$seen" = "$path" ]; then
                  known=true
                  break
                fi
              done < "$1"
              if [ "$known" = false ]; then
                printf '%s\0' "$path"
              fi
            done < "$2"
          }
          scratch=$(mktemp -d)
          list_changed "$scratch/before"
          # Fixing pass: let the auto-fixers tidy the release's own files.
          prek run --all-files || true
          list_changed "$scratch/after"
          newly_changed "$scratch/before" "$scratch/after" > "$scratch/outside"
          tracked=()
          untracked=()
          while IFS= read -r -d '' path; do
            echo "::error file=${path}::prek changed ${path}, which the release didn't touch. Fix it on main in its own PR." >&2
            if GIT_LITERAL_PATHSPECS=1 git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              tracked+=("$path")
            else
              untracked+=("$path")
            fi
          done < "$scratch/outside"
          if [ "${#tracked[@]}" -gt 0 ]; then
            GIT_LITERAL_PATHSPECS=1 git --no-pager diff -- "${tracked[@]}" >&2
          fi
          if [ "${#untracked[@]}" -gt 0 ]; then
            echo "Untracked files prek created:" >&2
            printf '  %s\n' "${untracked[@]}" >&2
          fi
          if [ "${#tracked[@]}" -gt 0 ] || [ "${#untracked[@]}" -gt 0 ]; then
            exit 1
          fi
          # Strict pass: anything still failing is a real failure.
          if ! prek run --all-files --show-diff-on-failure; then
            echo "::error::prek failed on the release changes; the uncommitted release diff follows." >&2
            git --no-pager diff HEAD >&2
            exit 1
          fi
          git commit -am "chore(release): Prepare for ${RELEASE_VERSION} release"

      - name: Show Changes Diff
        shell: bash
        run: |
          git show --color --stat --patch HEAD

      - name: Create Release Patch
        shell: bash
        run: |
          git format-patch --keep-subject --binary --stdout HEAD^ > toolr-${{ env.RELEASE_VERSION }}.patch

      - name: Upload Changes Diff Artifact
        id: upload-release-patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolr-${{ env.RELEASE_VERSION }}.patch
          path: toolr-${{ env.RELEASE_VERSION }}.patch
          retention-days: 7
          if-no-files-found: error

      - name: Attest release patch artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        # Only run attestations on the main repository, not on forks
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
        with:
          subject-path: toolr-${{ env.RELEASE_VERSION }}.patch

      - name: Create Source Tarballs
        id: create-source-tarball
        shell: bash
        # Build per-crate sdists. Each tarball unpacks to a single
        # top-level dir containing the crate's `pyproject.toml`, the
        # workspace `Cargo.toml`, `Cargo.lock`, and all sources needed
        # to compile from that pyproject. cibuildwheel can then run
        # against `package-dir: <unpacked-dir>` natively, without
        # needing CIBW_CONFIG_FILE.
        run: |
          rm -rf dist
          uv build --sdist --package toolr --out-dir dist
          uv build --sdist --package toolr-py --out-dir dist
          binary_tarball=""
          py_tarball=""
          for file in dist/*.tar.gz; do
            name="$(basename "$file")"
            case "$name" in
              toolr-*.tar.gz) binary_tarball="$name" ;;
              toolr_py-*.tar.gz) py_tarball="$name" ;;
            esac
          done
          if [ -z "$binary_tarball" ] || [ -z "$py_tarball" ]; then
            echo "Failed to locate both sdists in dist/:"
            ls -la dist/
            exit 1
          fi
          echo "binary-release-tarball-name=$binary_tarball" >> "$GITHUB_OUTPUT"
          echo "py-release-tarball-name=$py_tarball" >> "$GITHUB_OUTPUT"

      - name: Upload Binary-Wheel Source Tarball Artifact
        id: upload-binary-source-tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.create-source-tarball.outputs.binary-release-tarball-name }}
          path: dist/${{ steps.create-source-tarball.outputs.binary-release-tarball-name }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload toolr-py Source Tarball Artifact
        id: upload-py-source-tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.create-source-tarball.outputs.py-release-tarball-name }}
          path: dist/${{ steps.create-source-tarball.outputs.py-release-tarball-name }}
          retention-days: 7
          if-no-files-found: error

      - name: Attest source tarball artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        # Only run attestations on the main repository, not on forks
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
        with:
          subject-path: |
            dist/${{ steps.create-source-tarball.outputs.binary-release-tarball-name }}
            dist/${{ steps.create-source-tarball.outputs.py-release-tarball-name }}
