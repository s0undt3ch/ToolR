name: Release
run-name: "Release (branch: ${{ github.ref_name }}; version: ${{ inputs.release-version }})"

on:
  workflow_dispatch:
    inputs:
      release-version:
        required: false
        type: string
        description: 'Release version to prepare'

env:
  COLUMNS: 190
  FORCE_COLOR: "1"
  # Bump to invalidate every cache used by this workflow.
  CACHE_SEED: "1"
  # `MISE_VERSION` lives in `.github/env` (loaded per-job by a
  # "Load shared env vars" step) so a single edit propagates to every
  # workflow.

permissions: {}


concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.repository }}
  cancel-in-progress: false

jobs:

  prepare-ci:
    name: Prepare CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    outputs:
      platform-matrix: ${{ steps.generate-build-matrix.outputs.platform-matrix }}
      binary-archive-triples: ${{ steps.generate-build-matrix.outputs.binary-archive-triples }}
      pythons-binary: ${{ steps.generate-build-matrix.outputs.pythons-binary }}
      pythons-py: ${{ steps.generate-build-matrix.outputs.pythons-py }}
      # Mirrors env.CACHE_SEED / env.MISE_VERSION. Reusable workflows can't
      # read `env` from a caller's `with:` block, so they read these
      # outputs instead.
      cache-seed: ${{ steps.cache-seed.outputs.cache-seed }}
      mise-version: ${{ steps.mise-version.outputs.mise-version }}
    steps:

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check For Admin Permission
        uses: actions-cool/check-user-permission@c21884f3dda18dafc2f8b402fe807ccc9ec1aa5e # v2.4.0
        with:
          require: admin
          username: ${{ github.triggering_actor }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        # See ci.yml's matching step for why we sed-filter instead of cat.
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Expose cache seed
        id: cache-seed
        run: echo "cache-seed=${{ env.CACHE_SEED }}" >> "$GITHUB_OUTPUT"

      - name: Expose mise version
        id: mise-version
        run: echo "mise-version=$MISE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true
          cache_key_prefix: ${{ env.CACHE_SEED }}|mise|${{ env.MISE_VERSION }}|prepare-release|${{ runner.os }}|${{ runner.arch }}

      - name: Setup ToolR
        # In-repo composite action: downloads the toolr binary from a
        # GitHub release, verifies the SLSA build provenance, and
        # caches the in-tree `tools/.venv` so `toolr ci
        # generate-build-matrix` (which imports `packaging` from the
        # tools dependency group) doesn't have to rebuild the venv on
        # every release.
        id: setup-toolr
        uses: ./
        with:
          version: latest
          cache-prefix: ${{ env.CACHE_SEED }}|setup-toolr|prepare-release

      - name: Generate Build Matrix
        id: generate-build-matrix
        run: |
          toolr ci generate-build-matrix --workflow release

  prepare-release:
    name: Prepare Release
    needs:
      - prepare-ci
    uses: ./.github/workflows/_prepare-release.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      release-version: ${{ inputs.release-version }}
      github-app-client-id: ${{ vars.GH_APP_CLIENT_ID }}
      environment: release
      cache-seed: ${{ needs.prepare-ci.outputs.cache-seed }}
      mise-version: ${{ needs.prepare-ci.outputs.mise-version }}
    secrets:
      github-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

  build-binary-archive:
    name: Build (binary)
    needs:
      - prepare-ci
      - prepare-release
    uses: ./.github/workflows/_build-binary-archive.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      release-version: ${{ needs.prepare-release.outputs.release-version }}
      release-tarball-name: ${{ needs.prepare-release.outputs.binary-release-tarball-name }}
      cache-seed: ${{ needs.prepare-ci.outputs.cache-seed }}
      mise-version: ${{ needs.prepare-ci.outputs.mise-version }}
      targets: ${{ needs.prepare-ci.outputs.binary-archive-triples }}

  build-binary-wheel-linux:
    name: Build (binary wheel)
    needs:
      - prepare-ci
      - prepare-release
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      display-name: Linux
      release-tarball-name: ${{ needs.prepare-release.outputs.binary-release-tarball-name }}
      platform-matrix: ${{ toJSON(fromJSON(needs.prepare-ci.outputs.platform-matrix)['linux']) }}
      cache-seed: ${{ needs.prepare-ci.outputs.cache-seed }}
      mise-version: ${{ needs.prepare-ci.outputs.mise-version }}
      wheel-kind: binary
      pythons: ${{ needs.prepare-ci.outputs.pythons-binary }}

  build-py-wheel-linux:
    name: Build (toolr-py wheel)
    needs:
      - prepare-ci
      - prepare-release
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      display-name: Linux
      release-tarball-name: ${{ needs.prepare-release.outputs.py-release-tarball-name }}
      platform-matrix: ${{ toJSON(fromJSON(needs.prepare-ci.outputs.platform-matrix)['linux']) }}
      cache-seed: ${{ needs.prepare-ci.outputs.cache-seed }}
      mise-version: ${{ needs.prepare-ci.outputs.mise-version }}
      wheel-kind: py
      pythons: ${{ needs.prepare-ci.outputs.pythons-py }}

  build-binary-wheel-windows:
    name: Build (binary wheel)
    needs:
      - prepare-ci
      - prepare-release
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      display-name: Windows
      release-tarball-name: ${{ needs.prepare-release.outputs.binary-release-tarball-name }}
      platform-matrix: ${{ toJSON(fromJSON(needs.prepare-ci.outputs.platform-matrix)['windows']) }}
      cache-seed: ${{ needs.prepare-ci.outputs.cache-seed }}
      mise-version: ${{ needs.prepare-ci.outputs.mise-version }}
      wheel-kind: binary
      pythons: ${{ needs.prepare-ci.outputs.pythons-binary }}

  build-py-wheel-windows:
    name: Build (toolr-py wheel)
    needs:
      - prepare-ci
      - prepare-release
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      display-name: Windows
      release-tarball-name: ${{ needs.prepare-release.outputs.py-release-tarball-name }}
      platform-matrix: ${{ toJSON(fromJSON(needs.prepare-ci.outputs.platform-matrix)['windows']) }}
      cache-seed: ${{ needs.prepare-ci.outputs.cache-seed }}
      mise-version: ${{ needs.prepare-ci.outputs.mise-version }}
      wheel-kind: py
      pythons: ${{ needs.prepare-ci.outputs.pythons-py }}

  build-binary-wheel-macos:
    name: Build (binary wheel)
    needs:
      - prepare-ci
      - prepare-release
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      display-name: macOS
      release-tarball-name: ${{ needs.prepare-release.outputs.binary-release-tarball-name }}
      platform-matrix: ${{ toJSON(fromJSON(needs.prepare-ci.outputs.platform-matrix)['macos']) }}
      cache-seed: ${{ needs.prepare-ci.outputs.cache-seed }}
      mise-version: ${{ needs.prepare-ci.outputs.mise-version }}
      wheel-kind: binary
      pythons: ${{ needs.prepare-ci.outputs.pythons-binary }}

  build-py-wheel-macos:
    name: Build (toolr-py wheel)
    needs:
      - prepare-ci
      - prepare-release
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      display-name: macOS
      release-tarball-name: ${{ needs.prepare-release.outputs.py-release-tarball-name }}
      platform-matrix: ${{ toJSON(fromJSON(needs.prepare-ci.outputs.platform-matrix)['macos']) }}
      cache-seed: ${{ needs.prepare-ci.outputs.cache-seed }}
      mise-version: ${{ needs.prepare-ci.outputs.mise-version }}
      wheel-kind: py
      pythons: ${{ needs.prepare-ci.outputs.pythons-py }}

  # Universal pure-Python wheel — built once and shared across every
  # distribution-test matrix entry via the `example-plugin-wheel`
  # artifact. Mirrors the `build-example-plugin-wheel` job in
  # `ci.yml`. The `example_plugin_wheel` fixture has an inline-build
  # fallback, so this job is a CI-time optimisation, not a correctness
  # gate.
  build-example-plugin-wheel:
    name: Build (example plugin)
    needs:
      - prepare-ci
      - prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Virtual Environment
        uses: ./.github/actions/setup-virtualenv
        with:
          cache-prefix: build-example-plugin-wheel
          cache-seed: ${{ needs.prepare-ci.outputs.cache-seed }}
          uv-sync-args: "--no-install-workspace"
          mise-version: ${{ needs.prepare-ci.outputs.mise-version }}

      - name: Build the example-plugin wheel
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --out-dir wheelhouse examples/plugin-package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-plugin-wheel
          path: wheelhouse/toolr_plugin_example-*.whl

  # release.yml's distribution-tests defer to the same reusable
  # workflow ci.yml uses, so the test harness, action SHAs, coverage
  # upload, and junit reporting stay in lockstep across both
  # pipelines. Per-OS jobs (one workflow_call each) instead of a
  # `strategy.matrix` since `workflow_call` doesn't compose with
  # `strategy.matrix` on the caller side.
  test-distribution-linux:
    name: Test Distribution
    needs:
      - prepare-ci
      - build-binary-wheel-linux
      - build-py-wheel-linux
      - build-example-plugin-wheel
    uses: ./.github/workflows/_test_distribution.yml
    with:
      os: ubuntu-latest
      display-name: Linux
      cache-seed: ${{ needs.prepare-ci.outputs.cache-seed }}
      artifact-pattern: cibw-wheel-*-*linux*
      mise-version: ${{ needs.prepare-ci.outputs.mise-version }}
    permissions:
      contents: read
      id-token: write

  test-distribution-macos:
    name: Test Distribution
    needs:
      - prepare-ci
      - build-binary-wheel-macos
      - build-py-wheel-macos
      - build-example-plugin-wheel
    uses: ./.github/workflows/_test_distribution.yml
    with:
      os: macos-latest
      display-name: macOS
      cache-seed: ${{ needs.prepare-ci.outputs.cache-seed }}
      artifact-pattern: cibw-wheel-*-*macosx*
      mise-version: ${{ needs.prepare-ci.outputs.mise-version }}
    permissions:
      contents: read
      id-token: write

  test-distribution-windows:
    name: Test Distribution
    needs:
      - prepare-ci
      - build-binary-wheel-windows
      - build-py-wheel-windows
      - build-example-plugin-wheel
    uses: ./.github/workflows/_test_distribution.yml
    with:
      os: windows-latest
      display-name: Windows
      cache-seed: ${{ needs.prepare-ci.outputs.cache-seed }}
      artifact-pattern: cibw-wheel-*-*win*
      mise-version: ${{ needs.prepare-ci.outputs.mise-version }}
    permissions:
      contents: read
      id-token: write

  publish-release:
    name: Publish Release
    environment: release
    needs:
      - build-binary-wheel-linux
      - build-py-wheel-linux
      - build-binary-wheel-windows
      - build-py-wheel-windows
      - build-binary-wheel-macos
      - build-py-wheel-macos
      - build-binary-archive
      - test-distribution-linux
      - test-distribution-macos
      - test-distribution-windows
      - prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # We could stick this in a custom, in-repo action, but this would mean we would have to checkout
      # the now, and then checkout again with higher privileges, which is why we're doing it here.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Pushes the release tag and commit, and creates the GitHub release.
          permission-contents: write

      - name: Get GitHub App User ID
        id: get-user-id
        shell: bash
        run: |
          echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        shell: bash
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Apply Release Patch
        uses: ./.github/actions/apply-release-patch
        with:
          release-patch-name: ${{ needs.prepare-release.outputs.release-patch-name }}

      - name: Tag the v${{ needs.prepare-release.outputs.release-version }} Release
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release-version }}
        run: |
          git tag -m "chore(release): Release v${RELEASE_VERSION}" -a "v${RELEASE_VERSION}"

      - name: Push the release commit and tag
        id: push-release
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release-version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/heads/* ]]; then
            echo "::error::Releases must be dispatched on a branch (refs/heads/...), not ${GITHUB_REF}" >&2
            exit 1
          fi
          # Atomic, so a branch that moved since dispatch can't leave a tag on an orphaned commit.
          if git push --atomic origin "HEAD:refs/heads/${GITHUB_REF_NAME}" "refs/tags/v${RELEASE_VERSION}"; then
            exit 0
          fi
          # A failed atomic push doesn't say why, so ask origin whether anything landed and whether a re-run is safe.
          fail() {
            echo "::error::Pushing v${RELEASE_VERSION} failed: $1" >&2
            exit 1
          }
          tag="refs/tags/v${RELEASE_VERSION}"
          tag_lines="$(git ls-remote origin "${tag}" "${tag}^{}")" \
            || fail "origin could not be queried, so what was published is unknown. Check origin before retrying."
          if [[ -n "${tag_lines}" ]]; then
            # The peeled line names an annotated tag's commit; a lightweight tag has only the plain one.
            tag_commit="$(awk -v ref="${tag}^{}" '$2 == ref { print $1 }' <<<"${tag_lines}")"
            tag_commit="${tag_commit:-$(awk -v ref="${tag}" '$2 == ref { print $1 }' <<<"${tag_lines}")}"
            if [[ "${tag_commit}" == "$(git rev-parse HEAD)" ]]; then
              fail "origin already has v${RELEASE_VERSION} on this release commit, from an earlier attempt. Finish the publish-release steps after this one by hand: \"Attest final release artifacts\", \"Create GitHub release\" and \"Publish to PyPI (Trusted Publisher)\"."
            fi
            fail "origin has v${RELEASE_VERSION} on another commit (${tag_commit}), not this release commit. Stop and find out where that tag came from."
          fi
          branch_lines="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}")" \
            || fail "origin could not be queried, so what was published is unknown. Check origin before retrying."
          if [[ "${branch_lines%%[[:space:]]*}" != "${GITHUB_SHA}" ]]; then
            fail "origin's ${GITHUB_REF_NAME} moved since the run was dispatched, and nothing was published. Dispatch the release again from its new tip."
          fi
          fail "origin's ${GITHUB_REF_NAME} has not moved and nothing was published, so the cause is elsewhere (network, token, a server-side hook). Re-run this job once that is fixed."

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cibw-wheel-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare-release.outputs.binary-release-tarball-name }}
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare-release.outputs.py-release-tarball-name }}
          path: dist/

      # Per-triple binary archives (consumed by install.sh and the mise
      # plugin). Downloaded to a separate path so they are NOT uploaded to
      # PyPI — they are not Python distributions. They are still attached
      # to the GitHub Release alongside the wheels and sdists.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: toolr-archive-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare-release.outputs.release-notes-filename }}

      - name: Attest final release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release-version }}
          RELEASE_NOTES: ${{ needs.prepare-release.outputs.release-notes-filename }}
        # --verify-tag relies on the `push-release` step above having run.
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${RELEASE_VERSION}" \
            --notes-file "${RELEASE_NOTES}" \
            --latest \
            dist/* release-assets/*

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          verbose: true

  # Keep this job inline in release.yml: Sigstore records the calling
  # workflow file as the signing identity, and mise pins that identity.
  publish-packslip:
    name: Publish packslip
    # Runs even if publish-release failed after creating the release (e.g. a
    # PyPI outage); an earlier failure makes the tag checkout or download fail
    # loudly. "Re-run failed jobs" re-runs publish-release too, which fails
    # harmlessly on the existing tag, and this job re-signs with --clobber.
    if: >-
      ${{ !cancelled()
          && needs.prepare-release.result == 'success'
          && (needs.publish-release.result == 'success'
              || needs.publish-release.result == 'failure') }}
    needs:
      - prepare-release
      - publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      ARCHIVE_PATTERNS: toolr-*-*-apple-darwin.tar.gz toolr-*-*-linux-musl.tar.gz toolr-*-*-windows-msvc.zip
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare-release.outputs.release-version }}
          persist-credentials: false

      - name: Resolve the release commit
        id: source
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release-version }}
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse "v${RELEASE_VERSION}^{commit}")" >> "$GITHUB_OUTPUT"

      # Version must match the `github:jdx/packslip@1.11.1` pin in ci.yml.
      # The action uploads with `gh release upload --clobber`, so a re-run
      # re-signs and replaces the existing packslip.sigstore.json asset.
      # install-smoke.yml and tests/distribution/mise/ look for this asset as packslip.sigstore.json.
      - name: Sign and upload the packslip
        id: packslip
        uses: jdx/packslip@3a4afb16b29d3ac639fcd35cbe99124184f71859 # v1.11.1
        with:
          tag: v${{ needs.prepare-release.outputs.release-version }}
          version: ${{ needs.prepare-release.outputs.release-version }}
          commit: ${{ steps.source.outputs.commit }}
          manifest: .github/packslip.toml
          download: ${{ env.ARCHIVE_PATTERNS }}
          attest: link

      - name: Verify the published packslip
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.release-version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          read -ra patterns <<<"$ARCHIVE_PATTERNS"
          download_args=(-p packslip.sigstore.json)
          for p in "${patterns[@]}"; do
            download_args+=(-p "$p")
          done
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" "${download_args[@]}"
          artifacts=()
          for p in "${patterns[@]}"; do
            # shellcheck disable=SC2206 # unquoted on purpose: glob each pattern
            matches=($p)
            for f in "${matches[@]}"; do
              artifacts+=(--artifact "$f")
            done
          done
          # Hard-coded, not derived from github.workflow_ref: this catches a
          # signer change that mise users would have to re-approve.
          packslip verify packslip.sigstore.json \
            --identity https://github.com/s0undt3ch/ToolR/.github/workflows/release.yml@refs/heads/main \
            --issuer https://token.actions.githubusercontent.com \
            "${artifacts[@]}"
          packslip show packslip.sigstore.json \
            | jq -e --arg v "$VERSION" --arg c "$COMMIT" \
                '.predicate.version == $v and .predicate.source.commit == $c'

  # The scheduled smoke run would only reach this release on its next
  # cron tick, so start one now, after the packslip exists.
  # `workflow_dispatch` is one of the few events GITHUB_TOKEN may trigger.
  dispatch-install-smoke:
    name: Start the install smoke tests
    # Explicit, because publish-packslip can succeed after publish-release
    # failed, and the implicit success() would then skip this job.
    if: ${{ !cancelled() && needs.publish-packslip.result == 'success' }}
    needs:
      - prepare-release
      - publish-packslip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Dispatch install-smoke.yml
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.release-version }}
        run: |
          gh workflow run install-smoke.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"

  set-pipeline-exit-status:
    environment: release
    permissions: {}
    # This job gives the workflow a single check representing the whole run.
    # It must list EVERY job in `needs`: a job skipped because an upstream
    # dependency failed reports `skipped`, not `failure`, so a failure is
    # only visible here on the job that directly failed.
    name: Set the ${{ github.workflow }} Pipeline Exit Status
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build-binary-archive
      - build-binary-wheel-linux
      - build-binary-wheel-macos
      - build-binary-wheel-windows
      - build-example-plugin-wheel
      - build-py-wheel-linux
      - build-py-wheel-macos
      - build-py-wheel-windows
      - dispatch-install-smoke
      - prepare-ci
      - prepare-release
      - publish-packslip
      - publish-release
      - test-distribution-linux
      - test-distribution-macos
      - test-distribution-windows
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # A local `uses:` resolves from the checked-out tree, and gate jobs
      # otherwise never check out the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gate on the needed jobs' results
        uses: ./.github/actions/pipeline-gate
        with:
          jobs: ${{ toJSON(needs) }}
