name: Install Smoke Tests

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        # release.yml's dispatch-install-smoke passes this; keep the name in sync.
        description: 'Version to smoke-test (defaults to the newest release with a packslip)'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'installation/install.sh'
      - 'installation/install.ps1'
      - 'tests/distribution/conftest.py'
      - 'tests/distribution/mise/**'
      - '.github/env'
      - '.github/actions/setup-virtualenv/**'
      - '.github/workflows/install-smoke.yml'
  # PRs that touch the installers, the mise smoke tests or their setup
  # get a smoke-test run, to catch breakage before it lands on main. The
  # `smoke-pip-wheel` job is gated off below — it exercises the
  # published PyPI wheel, which a PR can't influence; running it here
  # would just retest main's last release.
  pull_request:
    paths:
      - 'installation/install.sh'
      - 'installation/install.ps1'
      - 'tests/distribution/conftest.py'
      - 'tests/distribution/mise/**'
      - '.github/env'
      - '.github/actions/setup-virtualenv/**'
      - '.github/workflows/install-smoke.yml'

permissions:
  contents: read

jobs:

  smoke-install-sh:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
          - macos-14
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install via install.sh (requires attestation verification)
        env:
          # `gh attestation verify` reads $GH_TOKEN to authenticate
          # against the GitHub API for attestation lookup.
          GH_TOKEN: ${{ github.token }}
          # Route the workflow_dispatch input through an env var rather than
          # interpolating it into the script body (CWE-78 shell injection).
          VERSION: ${{ inputs.version }}
        run: |
          # The runner image ships the `gh` CLI; --verify-attestation=require
          # fails the job if the SLSA attestation does not validate.
          if [ -n "$VERSION" ]; then
            sh ./installation/install.sh \
              --version "$VERSION" \
              --prefix "$RUNNER_TEMP/toolr-bin" \
              --verify-attestation=require
          else
            sh ./installation/install.sh \
              --prefix "$RUNNER_TEMP/toolr-bin" \
              --verify-attestation=require
          fi
      - name: Verify
        run: |
          "$RUNNER_TEMP/toolr-bin/toolr" --version
          "$RUNNER_TEMP/toolr-bin/toolr" --help

      # SEC-08 regression: with `gh` absent and the default mode
      # (`require`), the installer must FAIL CLOSED rather than silently
      # downgrade to checksum-only. Hide `gh`, run with NO
      # `--verify-attestation` flag (exercising the default), and assert a
      # non-zero exit whose message points at `gh` / the `skip` escape hatch.
      - name: install.sh fails closed when 'gh' is absent (SEC-08)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh_bin="$(command -v gh)"
          sudo mv "$gh_bin" "${gh_bin}.hidden"
          set +e
          if [ -n "$VERSION" ]; then
            out=$(sh ./installation/install.sh --version "$VERSION" --prefix "$RUNNER_TEMP/nogh-bin" 2>&1)
          else
            out=$(sh ./installation/install.sh --prefix "$RUNNER_TEMP/nogh-bin" 2>&1)
          fi
          rc=$?
          set -e
          sudo mv "${gh_bin}.hidden" "$gh_bin"
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::install.sh installed WITHOUT attestation verification when gh was absent (must fail closed)" >&2
            exit 1
          fi
          printf '%s\n' "$out" | grep -qi "gh" || {
            echo "::error::install.sh failed but without actionable gh/skip guidance" >&2
            exit 1
          }
          test ! -e "$RUNNER_TEMP/nogh-bin/toolr" || {
            echo "::error::install.sh placed the binary despite failing verification" >&2
            exit 1
          }
          echo "OK: install.sh failed closed (no gh, default=require)"

  smoke-install-ps1:
    name: install.ps1 (windows)
    runs-on: windows-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install via install.ps1 (requires attestation verification)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "toolr-bin"
          if ("$env:VERSION" -ne "") {
            ./installation/install.ps1 -Version "$env:VERSION" -Prefix $prefix -VerifyAttestation require
          } else {
            ./installation/install.ps1 -Prefix $prefix -VerifyAttestation require
          }
          & (Join-Path $prefix "toolr.exe") --version

  smoke-pip-wheel:
    name: pip install (${{ matrix.os }})
    # `pip install toolr` resolves against the published PyPI wheel
    # — a PR can't influence the result, so we only run this on
    # main / schedule / dispatch where the test is meaningful.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
          - macos-14
          - windows-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Smoke `pip install toolr` (binary wheel)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # `toolr` on PyPI is now the binary-only wheel produced from
          # crates/toolr/pyproject.toml — it ships the `toolr` executable
          # entry point but has no importable Python module.
          spec="toolr"; [ -n "$VERSION" ] && spec="toolr==$VERSION"
          python -m venv .venv-bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv-bin/Scripts/python.exe -m pip install --upgrade pip
            .venv-bin/Scripts/pip install "$spec"
            .venv-bin/Scripts/toolr.exe --version
          else
            .venv-bin/bin/python -m pip install --upgrade pip
            .venv-bin/bin/pip install "$spec"
            .venv-bin/bin/toolr --version
          fi

      - name: Smoke `pip install toolr-py` (pyo3 wheel)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # `toolr-py` on PyPI is the pyo3 bindings wheel produced from
          # crates/toolr-py/pyproject.toml — installs as `import toolr`
          # with the Rust extension at `toolr.utils._rust_utils`.
          spec="toolr-py"; [ -n "$VERSION" ] && spec="toolr-py==$VERSION"
          python -m venv .venv-py
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv-py/Scripts/python.exe -m pip install --upgrade pip
            .venv-py/Scripts/pip install "$spec"
            .venv-py/Scripts/python.exe -c "import toolr; import toolr.utils._rust_utils; print(toolr.__version__)"
          else
            .venv-py/bin/python -m pip install --upgrade pip
            .venv-py/bin/pip install "$spec"
            .venv-py/bin/python -c "import toolr; import toolr.utils._rust_utils; print(toolr.__version__)"
          fi

  # Installs the published release through mise's packslip and aqua
  # backends, then checks the binary, the packslip's declared skills and
  # its shell completions. The checks live in `tests/distribution/mise/`.
  #
  # Runs on pull requests too, unlike the other remote jobs: a PR can't
  # change what's published, but it can change the tests.
  smoke-mise:
    name: mise packslip + aqua (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-14
          - windows-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load shared env vars
        shell: bash
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"
      - name: Setup Virtual Environment
        uses: ./.github/actions/setup-virtualenv
        with:
          cache-prefix: smoke-mise
          mise-version: ${{ env.MISE_VERSION }}
      - name: Install shells for the completion tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bash-completion fish zsh
      # macOS ships bash 3.2 without bash-completion, and no fish.
      # bash-completion 2 needs bash 4.2+, so put Homebrew's bash first.
      - name: Install shells for the completion tests (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash bash-completion@2 fish
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      # Not `@latest`: mise holds a fresh release back from `latest` for a
      # while, so a run right after a release would test the previous one.
      # The newest release with a packslip, not just the newest: release.yml
      # uploads the packslip a few minutes after creating the release.
      - name: Resolve the version to test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq \
              '[.[] | select(.draft | not) | select(any(.assets[]; .name == "packslip.sigstore.json"))][0].tag_name')
          fi
          echo "TOOLR_SMOKE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      # `--no-sync` stops uv building HEAD's toolr, and `--confcutdir` skips
      # tests/conftest.py, which imports it. The version guard stops a lost
      # env var from skipping every test into a green job.
      - name: Run the mise smoke tests
        shell: bash
        env:
          # Anonymous GitHub API calls hit the rate limit, and mise then
          # silently drops packslip skills.
          GITHUB_TOKEN: ${{ github.token }}
          TOOLR_SMOKE_REQUIRE_SHELLS: ${{ runner.os != 'Windows' && '1' || '' }}
        run: |
          : "${TOOLR_SMOKE_VERSION:?not set by the resolve step}"
          uv run --no-sync pytest -ra -v --color=yes --confcutdir=tests/distribution tests/distribution/mise/

  report:
    name: Report
    if: always()
    runs-on: ubuntu-latest
    needs:
      - smoke-install-ps1
      - smoke-install-sh
      - smoke-mise
      - smoke-pip-wheel
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # A local `uses:` resolves from the checked-out tree, and gate jobs
      # otherwise never check out the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gate on the needed jobs' results
        uses: ./.github/actions/pipeline-gate
        with:
          jobs: ${{ toJSON(needs) }}
