[package]
name = "toolr-core"
description = "Core domain library for toolr (no pyo3, no CLI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["full"]
# Everything except the `command` and `docstrings` modules, which are all toolr-py links.
full = [
    "dep:serde_json",
    "dep:anyhow",
    "dep:thiserror",
    "dep:blake3",
    "dep:chrono",
    "dep:uuid",
    "dep:email_address",
    "dep:pep440_rs",
    "dep:walkdir",
    "dep:ruff_python_parser",
    "dep:ruff_python_ast",
    "dep:tempfile",
    "dep:signal-hook-registry",
    "dep:toml",
    "dep:dirs",
    "dep:glob",
    "dep:reqwest",
    "dep:flate2",
    "dep:tar",
    "dep:zip",
    "dep:sha2",
]

[dependencies]
serde.workspace = true
serde_json = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
# `command` uses it, so toolr-py links it too.
libc.workspace = true
email_address = { workspace = true, optional = true }
pep440_rs = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
ruff_python_parser = { workspace = true, optional = true }
ruff_python_ast = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
signal-hook-registry = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
glob = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# `command` walks and kills the child's process tree with it.
winapi = { version = "0.3", features = ["handleapi", "processthreadsapi", "tlhelp32", "winnt"] }

[dev-dependencies]
tokio.workspace = true
tempfile.workspace = true
anyhow.workspace = true
assert_cmd.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# Test-only features, on top of the normal dependency's.
winapi = { version = "0.3", features = ["minwinbase"] }
